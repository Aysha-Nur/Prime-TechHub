# ── Nginx Worker Configuration ───────────────────────────────────
events {
    worker_connections 1024;
}

http {
    # ── Upstream: points to the Streamlit container by service name ──
    # "streamlit" matches the service name in docker-compose.yml
    upstream streamlit_app {
        server streamlit:8501;
    }

    # ── Main server block ─────────────────────────────────────────
    server {
        listen 80;
        server_name _;   # Accepts requests for any hostname/IP

        # ── Core proxy settings ───────────────────────────────────
        location / {
            proxy_pass http://streamlit_app;

            # CRITICAL: HTTP/1.1 required for WebSocket upgrade
            proxy_http_version 1.1;

            # CRITICAL: These two headers enable WebSocket connections
            # Without them, Streamlit gets stuck on "Loading..."
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard reverse proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CRITICAL: Disable buffering for Streamlit's streaming output
            # With buffering ON, the page hangs until the buffer fills
            proxy_buffering off;

            # Extended timeouts for persistent WebSocket connections
            # (default 60s would kill the Streamlit session mid-use)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 30s;
        }
    }
}